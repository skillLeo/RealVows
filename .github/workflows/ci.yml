name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # GD is what the photo pipeline uses. It is the extension actually
          # present on Hostinger shared hosting, so CI matches production.
          extensions: mbstring, pdo, pdo_sqlite, gd, bcmath, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Required, not optional. public/build is gitignored, and every page
      # renders through @vite — without a manifest each one returns 500 and
      # the whole suite fails for a reason that has nothing to do with the
      # code under test. Building here also means the tests exercise the real
      # asset pipeline rather than a stub.
      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the test suite
        run: ./vendor/bin/phpunit

  content-rules:
    name: Content rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      # ─────────────────────────────────────────────────────────────────────
      # The contractual content rules, enforced by the pipeline rather than by
      # anyone remembering them.
      #
      # ⚠️ THESE GREPS ARE THE SECOND NET, NOT THE GUARANTEE.
      #
      # The real guarantee is ForbiddenLanguageTest, which exercises the
      # actual generators over a thousand pairs — copy assembled at runtime
      # from two innocent halves would pass every grep below and fail there.
      # These exist to catch the other direction: somebody hardcoding a term
      # into a template where no test happens to look.
      #
      # Three tiers, because a single flat list was already failing on honest
      # writing. "Down to earth" is good copy; \bearth\b across all of
      # resources/ would reject it.
      # ─────────────────────────────────────────────────────────────────────

      - name: "Tier 1 — banned outright, everywhere a member can reach"
        run: |
          set +e
          FOUND=0

          # The compiled bundle is included deliberately: it is what actually
          # ships, and it catches anything a template imported from elsewhere.
          SCOPE="resources/ public/build/ app/Mail/ lang/"

          check () {
            MATCH=$(grep -rniE "$1" $SCOPE 2>/dev/null \
              | grep -v 'Services/Matching/AffinityMatrix' \
              | grep -v 'Services/Sign/SignCalculator')
            if [ -n "$MATCH" ]; then
              echo "::error::$2"
              echo "$MATCH" | head -20
              FOUND=1
            fi
          }

          check 'zodiac|star sign|sun sign|astrolog|synastry|horoscope|natal chart|birth chart|celestial' \
                'A banned mechanism term reached user-facing code.'

          check '\b(aries|taurus|gemini|virgo|libra|scorpio|sagittarius|capricorn|aquarius|pisces)\b' \
                'A sign name reached user-facing code.'

          # "Cancer" and "Leo" need their own passes: one is a disease and a
          # perfectly ordinary word, the other is inside SkillLeo.
          CANCER=$(grep -rniE '\bcancer\b' $SCOPE 2>/dev/null | grep -viE 'cancer (research|charity|awareness)')
          if [ -n "$CANCER" ]; then echo "::error::Sign name 'Cancer' found"; echo "$CANCER" | head -5; FOUND=1; fi

          LEO=$(grep -rnE '\bLeo\b' $SCOPE 2>/dev/null | grep -viE 'skillleo')
          if [ -n "$LEO" ]; then echo "::error::Sign name 'Leo' found"; echo "$LEO" | head -5; FOUND=1; fi

          if grep -rnP '[\x{2648}-\x{2653}]' $SCOPE 2>/dev/null; then
            echo "::error::A sign glyph reached user-facing code."; FOUND=1
          fi

          exit $FOUND

      - name: "Tier 2 — mechanism vocabulary inside generated copy"
        run: |
          # Scoped to the generators only. These words are innocent in
          # ordinary romantic writing and would fire constantly platform-wide;
          # inside a rationale or a commonality they are a tell.
          set +e
          if grep -rniE '(fire|air|earth|water) sign|fire and air|earth and water|\b(cardinal|mutable|modality|elemental)\b' \
               app/Services/Matching/Copy/ 2>/dev/null; then
            echo "::error::Mechanism vocabulary found in a copy generator."
            exit 1
          fi
          exit 0

      - name: "Tier 3 — the product rules"
        run: |
          set +e
          FOUND=0

          if grep -rniE 'six photos|6 photos' resources/ 2>/dev/null; then
            echo "::error::Photo count is four. 'six photos' is the obsolete spec."
            FOUND=1
          fi

          # Shared hosting batches queued work roughly every minute. Promising
          # instant behaviour is a promise the architecture cannot keep.
          if grep -rniE '>[^<]*\b(instantly|immediately|right away)\b' resources/views resources/js 2>/dev/null; then
            echo "::error::UI copy promises instant behaviour. Use 'shortly' or 'usually within a day'."
            FOUND=1
          fi

          # There is no browsing in this product, in any phase.
          if grep -rniE 'browse profiles|search profiles|all members|profile directory' resources/ 2>/dev/null; then
            echo "::error::Browsing language found. The engine chooses; members never shop."
            FOUND=1
          fi

          exit $FOUND

  assets:
    name: Build & budget
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      # The performance budget is a requirement, not a hope. Members open this
      # on mid-range phones over 4G — a slow page is an unromantic page.
      - name: Enforce the JS budget
        run: |
          HOME_KB=$(gzip -c public/build/assets/public-*.js | wc -c | awk '{print int($1/1024)}')
          APP_KB=$(gzip -c public/build/assets/app-*.js | wc -c | awk '{print int($1/1024)}')

          echo "home JS: ${HOME_KB} KB gzipped (budget 30)"
          echo "app  JS: ${APP_KB} KB gzipped (budget 150)"

          [ "$HOME_KB" -le 30 ]  || { echo "::error::Home JS over budget"; exit 1; }
          [ "$APP_KB"  -le 150 ] || { echo "::error::App JS over budget";  exit 1; }

      - name: Keep the built assets for deployment
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/build
          retention-days: 5
