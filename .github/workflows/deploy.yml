name: Deploy

# Manual only, and only from main.
#
# Deliberately not automatic on push. The client reviews and signs off each
# phase on a staging build before it becomes live, so a commit landing on main
# is not the same event as a release.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    env:
      # Hostinger's default CLI php is 8.2; Laravel 13 needs 8.4.1+.
      # Naming the binary is not optional.
      PHP: /opt/alt/php84/usr/bin/php

    steps:
      # Through env, never interpolated straight into the shell. Workflow
      # inputs are attacker-controlled text as far as the runner is concerned,
      # and `${{ }}` inside run: is substituted before bash ever sees it — so
      # a crafted value would execute rather than be compared.
      - name: Check the confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          [ "$CONFIRM" = "DEPLOY" ] || { echo "::error::Type DEPLOY to confirm."; exit 1; }

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, gd, bcmath, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Assets are built here, not on the server. Shared hosting has little
      # memory and often no Node at all; shipping the compiled output keeps
      # the deploy fast and the server simple.
      - name: Build
        run: |
          npm ci
          npm run build

      - name: Install production dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Open the SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Put the site into maintenance
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "PHP=$PHP; cd ${{ secrets.DEPLOY_PATH }} && $PHP artisan down --retry=30 || true"

      # .env, storage and the public uploads are the server's own state and
      # are never overwritten by a deploy. Losing storage would lose every
      # member photograph.
      - name: Sync the application
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'storage' \
            --exclude '_design' \
            --exclude 'tests' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Migrate and warm the caches
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "PHP=$PHP; cd ${{ secrets.DEPLOY_PATH }} && \
             $PHP artisan migrate --force && \
             $PHP artisan db:seed --class=RolesAndPermissionsSeeder --force && \
             $PHP artisan db:seed --class=SettingsSeeder --force && \
             $PHP artisan config:cache && \
             $PHP artisan route:cache && \
             $PHP artisan view:cache"

      # The WhatsApp verify token, if one has been set as a repository secret.
      #
      # ⚠️ PIPED, NOT PASSED AS AN ARGUMENT. On a shared host any other account
      # can read a command line out of the process list, so a secret must never
      # appear in argv. GitHub masks it in the log; ps would not.
      #
      # Skipped silently when the secret is absent, so a deploy never depends
      # on it — the endpoint answers 503 and says so in its own log.
      #
      # ⚠️ The secret is mapped to env first. The `secrets` context is not
      # available inside a step-level `if:`, and referencing it there does not
      # evaluate to false — it fails the whole workflow at parse time with
      # "Unrecognized named-value: 'secrets'", so no deploy runs at all.
      - name: Apply the WhatsApp verify token
        env:
          VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        if: ${{ env.VERIFY_TOKEN != '' }}
        run: |
          printf '%s\n' "$VERIFY_TOKEN" | \
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "PHP=$PHP; cd ${{ secrets.DEPLOY_PATH }} && $PHP artisan whatsapp:verify-token --stdin --force"

      - name: Bring the site back
        if: always()
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "PHP=$PHP; cd ${{ secrets.DEPLOY_PATH }} && $PHP artisan up"

      # ⚠️ A 200 ON THE HOME PAGE IS NOT PROOF THE DEPLOY WAS SAFE.
      #
      # On 2 August 2026 rsync --delete removed the web-root .htaccess, which
      # both rewrites into public/ and guards everything else. The site
      # answered 403 and composer.json became publicly readable. The health
      # check below could not tell the difference between "broken" and
      # "serving you its source code" — this step can.
      - name: Confirm the web root is not exposing the application
        env:
          DEPLOY_URL: https://realvows.skillleo.com
        run: |
          # ⚠️ The production install above dropped PHPUnit, and `tests/` is
          # excluded from the rsync, so the check exists on neither side by
          # default. Restoring dev dependencies HERE, on the runner, after the
          # server has already been synced, is what lets the assertion live in
          # one place instead of being duplicated as a shell loop that drifts.
          composer install --no-interaction --prefer-dist --quiet
          php artisan test --filter=WebRootExposure

      - name: Confirm it is serving
        run: |
          sleep 5
          CODE=$(curl -s -o /dev/null -w '%{http_code}' https://realvows.skillleo.com)
          echo "Home page: $CODE"
          [ "$CODE" = "200" ] || { echo "::error::Site did not come back with 200"; exit 1; }
