name: Deploy

# ⚠️ THIS DEPLOYS TO THE CLIENT'S VPS, NOT TO THE DEVELOPER'S SHARED HOST.
#
# The previous version of this file deployed to realvows.skillleo.com, which is
# Hassam's own Hostinger shared hosting. That was correct while the project was
# in review and wrong the moment the client bought his own server: pushing to
# main was moving the staging build and nothing else, so "deployed" meant one
# thing to the person typing it and another to the person paying for it.
#
# Target is now srv1896577.hstgr.cloud (2.25.102.137), Ubuntu 24.04, which the
# client owns.
#
# ⚠️ MANUAL ONLY, AND DELIBERATELY. A commit landing on main is not a release.
# The client reviews before anything reaches members.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: ''
      # ⚠️ CLOSED SETS, NOT FREE TEXT.
      #
      # These values end up in a command that runs as root on the client's
      # server. As free-text inputs they were a command injection: a single
      # quote inside the value closed the quoting and everything after it ran
      # as root on the box holding members' photographs.
      #
      # `choice` removes the whole class of problem at the source, because
      # GitHub will not dispatch a value that is not on the list. The
      # validation step below is the second line, for the API path and for the
      # day somebody adds a free-text input here without thinking about it.
      seed_demo:
        description: 'Re-seed the demo members after deploying'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']
      teardown_demo:
        description: 'Demo teardown. "execute" is irreversible.'
        required: false
        default: 'skip'
        type: choice
        options: ['skip', 'dry', 'execute']
      settings_status:
        description: 'Show which settings are filled in, never their values'
        required: false
        default: 'skip'
        type: choice
        options: ['skip', 'mail', 'payments', 'general', 'whatsapp', 'storage']

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the client VPS
    runs-on: ubuntu-latest
    environment: production

    env:
      APP_DIR: /var/www/realvows
      PHP: /usr/bin/php8.4

    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          [ "$CONFIRM" = "DEPLOY" ] || { echo "::error::Type DEPLOY to confirm."; exit 1; }

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Build here rather than on the server ──────────────────────────────
      # The VPS has 2 vCPU and is also serving members. A `npm ci && vite
      # build` on the box during a deploy competes with the requests it is
      # meant to be answering. The runner is free and idle.
      - name: Install and build
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          npm ci
          npm run build

      - name: Load the deploy key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::VPS_SSH_KEY secret is not set."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # ⚠️ RETRIED, AND THE RETRY IS THE POINT. Hostinger has thrown a
      # connection timeout on five separate deploys of this project. Every one
      # of them landed BEFORE the site was taken down, which is the only reason
      # nothing broke. Bounded so a genuinely dead host still fails the job.
      - name: Trust the host
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "Host key collected on attempt $attempt."
              exit 0
            fi
            echo "::warning::ssh-keyscan attempt $attempt failed; retrying."
            sleep 10
          done
          echo "::error::Could not reach the host after 5 attempts. Nothing was changed on the server."
          exit 1

      - name: Ship the build
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          # ⚠️ .env is NEVER shipped. It holds the database and mailbox
          # passwords and it lives on the server only. --delete would remove it
          # along with storage, so both are excluded explicitly.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude '.env' \
            --exclude 'storage/' \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Migrate and warm the caches
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
            set -e
            cd /var/www/realvows
            /usr/bin/php8.4 artisan down --render="errors::503" || true
            /usr/bin/php8.4 artisan migrate --force
            /usr/bin/php8.4 artisan config:cache
            /usr/bin/php8.4 artisan route:cache
            /usr/bin/php8.4 artisan view:cache
            /usr/bin/php8.4 artisan storage:link || true
            # The marketing pages read this file instead of the database.
            /usr/bin/php8.4 artisan realvows:project-public-state
            chown -R deploy:www-data /var/www/realvows
            chmod -R 775 storage bootstrap/cache
            /usr/bin/php8.4 artisan up
          REMOTE

      # ⚠️ FAIL CLOSED ON ANYTHING NOT ON THE LIST.
      #
      # `type: choice` constrains the web UI. It does NOT constrain the REST
      # API, which will happily dispatch a workflow with an arbitrary string in
      # any input. So the value is checked against the closed set here, in the
      # runner, before it can reach a shell on the client's server.
      #
      # A case statement rather than a regex: the set is small, closed, and
      # written out, so there is nothing to get subtly wrong.
      - name: Validate the operation inputs
        env:
          SEED: ${{ github.event.inputs.seed_demo }}
          TEARDOWN: ${{ github.event.inputs.teardown_demo }}
          STATUS: ${{ github.event.inputs.settings_status }}
        run: |
          case "${SEED:-no}" in no|yes) ;; *) echo "::error::seed_demo must be no or yes."; exit 1 ;; esac
          case "${TEARDOWN:-skip}" in skip|dry|execute) ;; *) echo "::error::teardown_demo must be skip, dry or execute."; exit 1 ;; esac
          case "${STATUS:-skip}" in skip|mail|payments|general|whatsapp|storage) ;; *) echo "::error::settings_status is not a known group."; exit 1 ;; esac
          echo "Inputs are on the allow-list."

      # ⚠️ NOTHING FROM AN INPUT IS INTERPOLATED INTO THE REMOTE COMMAND.
      #
      # The remote script is a quoted heredoc, so the runner does no expansion
      # on it at all. The three values arrive as ARGUMENTS to `bash -s`, which
      # means the remote shell receives them as $1 $2 $3 rather than as text it
      # has to parse. Even if validation above were removed, there is no
      # quoting for a value to break out of.
      - name: Optional operations
        if: ${{ github.event.inputs.seed_demo == 'yes' || github.event.inputs.teardown_demo != 'skip' || github.event.inputs.settings_status != 'skip' }}
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SEED: ${{ github.event.inputs.seed_demo }}
          TEARDOWN: ${{ github.event.inputs.teardown_demo }}
          STATUS: ${{ github.event.inputs.settings_status }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            bash -s -- "${SEED:-no}" "${TEARDOWN:-skip}" "${STATUS:-skip}" <<'REMOTE'
            set -e
            seed="$1"; teardown="$2"; status="$3"
            cd /var/www/realvows
            [ "$seed" = "yes" ] && /usr/bin/php8.4 artisan db:seed --class=DemoSeeder --force
            [ "$teardown" != "skip" ] && /usr/bin/php8.4 artisan realvows:teardown-demo --mode="$teardown"
            [ "$status" != "skip" ] && /usr/bin/php8.4 artisan realvows:settings-status "$status"
            true
          REMOTE

      # ⚠️ ALWAYS. If a step above died after `artisan down`, the site is
      # sitting on a maintenance page and the only thing that lifts it is this.
      # The server-side MaintenanceWatchdog cron is the backstop for the case
      # where this step cannot run either, because SSH is what failed.
      - name: Bring the site back
        if: always()
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /var/www/realvows && /usr/bin/php8.4 artisan up" || true

      - name: Confirm the site answers
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          for attempt in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "http://$SSH_HOST/" || echo 000)
            if [ "$CODE" = "200" ]; then echo "Home page answered 200."; exit 0; fi
            echo "::warning::Home page returned $CODE on attempt $attempt."
            sleep 10
          done
          echo "::error::The site is not answering 200 after the deploy."
          exit 1
